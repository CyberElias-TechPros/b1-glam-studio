name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test booking + user
        run: |
          npx -y wrangler@latest d1 execute b1_glam_db --remote --command "DELETE FROM bookings WHERE id='55901cb4-e1e9-4f59-9aa2-98b1b3a3effe';"
          npx -y wrangler@latest d1 execute b1_glam_db --remote --command "DELETE FROM sessions WHERE user_id='3e1c646a-4381-4d29-8bf3-fbf81710919a';"
          npx -y wrangler@latest d1 execute b1_glam_db --remote --command "DELETE FROM users WHERE id='3e1c646a-4381-4d29-8bf3-fbf81710919a';"
          npx -y wrangler@latest d1 execute b1_glam_db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='3e1c646a-4381-4d29-8bf3-fbf81710919a';"
